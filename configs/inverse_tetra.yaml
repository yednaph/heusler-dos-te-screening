# Inverse Tetragonal Heusler - ALIGNN DOS Training Configuration
# Dataset: Inverse Heusler compounds in tetragonal structure
# Expected: ~12,000-15,000 materials
# SVNIT Aurora: H100 NVL 94GB VRAM

# Training overrides for SVNIT Aurora H100 NVL
training:
  batch_size: 128                # H100 NVL 94GB (increase to 256 after smoke test)

data:
  dos_dir: "data/inverse_tetra/dos_json/"
  train_file: "data/inverse_tetra/data_split/train_ids.csv"
  val_file: "data/inverse_tetra/data_split/val_ids.csv"
  test_file: "data/inverse_tetra/data_split/test_ids.csv"
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

output_dir: "output/inverse_tetra/"

logging:
  tensorboard: true
  tensorboard_dir: "output/inverse_tetra/logs/tensorboard"
  wandb:
    enabled: false
    name: "inverse-tetragonal"
    tags: ['inverse-heusler', 'tetragonal', 'alignn-dos']
  verbose: true

model:
  atom_input_features: 97  # 92 base CGCNN (one-hot) + 5 Heusler-specific; must match dos_dataset.ATOM_INPUT_FEATURES
